services:
  - type: web
    name: careeros-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/careeros.db
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
    disk:
      name: careeros-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: careeros-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: CAREEROS_API_URL
        value: https://careeros-api-yadv.onrender.com
